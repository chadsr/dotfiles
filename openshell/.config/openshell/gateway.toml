# OpenShell gateway config.

[openshell]
version = 2

[openshell.gateway]
# Pinned: the gateway otherwise auto-detects Kubernetes, Podman, then Docker.
compute_driver = "docker"

[openshell.drivers.docker]
# docker0 address, not loopback: the gateway rejects the host.openshell.internal Host header on loopback.
host_gateway_ip = "172.17.0.1"
