# OpenShell gateway config: vendor-seeded defaults plus local Docker overrides. See openshell/README.md.

[openshell]
version = 2

[openshell.gateway]
# Pinned: the gateway otherwise auto-detects Kubernetes, Podman, then Docker.
compute_driver = "docker"

[openshell.drivers.docker]
# docker0 instead of the loopback default, which would force the MCP gateway onto loopback, where it rejects the host.openshell.internal Host header.
host_gateway_ip = "172.17.0.1"
