# OpenShell provider profile: bearer token for the host-local docker-mcp-gateway, plus its MCP tool allowlist. See openshell/README.md.
# The allowlist lives only here (policies/opencode.yaml carries no copy of the endpoint); deny_rules win over allow rules; after an edit run `opencode-sandbox --setup`.
id: mcp-gateway
display_name: Docker MCP Gateway
description: Bearer token for the host-local docker-mcp-gateway (dev-tools)
category: other
credentials:
  - name: api_key
    description: Gateway bearer token
    env_vars: [MCP_GATEWAY_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    stable_placeholder: true
endpoints:
  - host: host.openshell.internal
    port: 8811
    path: /mcp
    protocol: mcp
    enforcement: enforce
    allowed_ips: [172.17.0.1/32]
    mcp:
      allow_all_known_mcp_methods: false
      strict_tool_names: true
      versions: ['2025-03-26', '2025-06-18', '2025-11-25']
    rules:
      - allow:
          method: initialize
      - allow:
          method: notifications/initialized
      - allow:
          method: tools/list
      - allow:
          method: ping
      # brave: 8 of 8 allowed.
      - allow:
          method: tools/call
          tool: brave_image_search
      - allow:
          method: tools/call
          tool: brave_llm_context
      - allow:
          method: tools/call
          tool: brave_local_search
