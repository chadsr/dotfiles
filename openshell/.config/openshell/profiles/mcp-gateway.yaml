          tool: brave_place_search
      - allow:
          method: tools/call
          tool: brave_summarizer
      - allow:
          method: tools/call
          tool: brave_video_search
      - allow:
          method: tools/call
          tool: brave_web_search
      # context7: 2 of 2 allowed.
