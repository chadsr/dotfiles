AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
HostbasedAuthentication no
IgnoreRhosts yes
KerberosAuthentication no
GSSAPIAuthentication no
PermitUserEnvironment no
PermitUserRC no

AllowGroups ssh-users

MaxAuthTries 3
MaxSessions 8
MaxStartups 10:30:60
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
UseDNS no

# Forwarding: default-deny (DisableForwarding)
DisableForwarding yes
X11Forwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
PermitOpen none
PermitListen none
PermitTunnel no
GatewayPorts no
StreamLocalBindUnlink yes

# Grants: agent forwarding and remote unix-socket only
# AllowTcpForwarding remote is required for forwarding unix socket (mindrot/openssh-bugs #3686)
Match Group ssh-users
    DisableForwarding no
    AllowAgentForwarding yes
    AllowTcpForwarding remote
    AllowStreamLocalForwarding remote
    PermitOpen none
    PermitListen none
