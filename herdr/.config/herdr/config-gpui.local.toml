# Sheprd overrides. Saved changes reload automatically.
# Unset keys inherit config-gpui.toml.

layout = "comfortable-rounded"
theme = "light:Catppuccin Latte,dark:Catppuccin Mocha"
status_icons = "wave"
remove_merged_worktrees = true
herdr_2_terminals = true
herdr_2_scrollback = 100000
tab_layout = "classic"
edge_rail = true
contrast = "high"

[features]
moonframe_window = false

[backdrop]
opacity = 0.75
blur = false

[terminal]
family = "Hack Nerd Font Mono"
size = 14.0

[sidebar]
family = "Hack Nerd Font Mono"
size = 12.0

[tabs]
family = "Hack Nerd Font Mono"
size = 12.0

[ui]
family = "Hack Nerd Font Mono"
size = 12.0

[chat]
glide = true
max_width = 0
layout = "opencode"

[tab_labels]
agent_title = true
